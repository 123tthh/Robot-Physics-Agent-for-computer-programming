[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vskill-os"
version = "0.4.0"
description = "Verifier-grounded Agent-Skill runtime for humanoid physical computer use"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vskill-demo = "vskill_os.demo:main"
vskill = "vskill_os.cli:main"
vskill-benchmark = "vskill_os.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
