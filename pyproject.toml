[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vskill-os"
version = "0.4.0"
description = "Verifier-grounded Agent-Skill runtime for humanoid physical computer use"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
chair-training = ["torch>=2.4"]
learning-batch = ["numpy>=1.26"]
learning-training = ["torch>=2.4", "numpy>=1.26"]
learning-desktop = ["numpy>=1.26", "Pillow>=10", "pygame==2.6.1", "pyte==0.8.2", "wcwidth==0.2.13"]
virtual-computer = ["pygame==2.6.1", "pyte==0.8.2", "wcwidth==0.2.13"]

[project.scripts]
vskill-demo = "vskill_os.demo:main"
vskill = "vskill_os.cli:main"
vskill-benchmark = "vskill_os.benchmark:main"
vskill-chair = "vskill_os.chair.cli:main"
vskill-chair-demo = "vskill_os.chair.demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
